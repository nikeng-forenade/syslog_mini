<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syslog</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#d7dce4;--muted:#8b93a3;--accent:#3b82f6}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0}.wrap{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 44px)}
aside{border-right:1px solid var(--line);padding:10px;overflow:auto;background:var(--panel)}
.day{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.day:hover{background:#1f2530}.day.active{background:#1d2939;color:var(--accent)}.day .count{color:var(--muted);font-size:12px}
button{background:#232a36;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
button:hover{background:#2c3542}button.danger:hover{background:#5b1f24;border-color:#7a2b31}
main{display:flex;flex-direction:column;min-width:0}
.filters{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
input,select{background:#0f1115;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.table{flex:1;overflow:auto}table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:6px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
td{padding:4px 10px;border-bottom:1px solid #1b202a;vertical-align:top}tr:hover td{background:#141922}
.sev{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;color:#fff}
.emerg,.alert,.crit{background:#b91c1c}.err{background:#dc2626}.warning{background:#d97706}
.notice{background:#2563eb}.info{background:#4b5563}.debug{background:#374151}
.msg{white-space:pre-wrap;word-break:break-word}.del{opacity:.4}tr:hover .del{opacity:1}
.day .del{opacity:.9;padding:2px 6px;font-size:12px}.day:hover .del{opacity:1}
.chips{display:flex;gap:6px;padding:6px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);align-items:center}
.chips button{font-size:12px;padding:2px 10px}
.chips button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hostlink{color:var(--accent);text-decoration:none;cursor:pointer}.hostlink:hover{text-decoration:underline}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#status.online{color:#22c55e;animation:blink 1.2s ease-in-out infinite;font-weight:600}
#status.offline{color:#ef4444;animation:blink .8s ease-in-out infinite;font-weight:600}
.online-dot{color:#22c55e}.offline-dot{color:#ef4444}
#hosts{font-variant-numeric:tabular-nums;cursor:pointer}
#ver{font-size:11px;background:var(--line);padding:2px 8px;border-radius:10px}
#disk{font-size:11px;background:var(--line);padding:2px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(600px,94vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#hostsModal .modal{width:min(720px,96vw)}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.modal-body{overflow:auto;padding:8px 16px}
.modal-footer{padding:8px 16px;border-top:1px solid var(--line);font-size:12px}
.host-row{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid #1b202a}
.host-top{display:flex;align-items:center;gap:10px;min-width:0}
.host-row .host-name{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.host-controls{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.host-field{display:flex;flex-direction:column;gap:3px}
.host-field label{color:var(--muted);font-size:11px;white-space:nowrap}
.host-field input[type=number]{width:90px;background:#0f1115;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 6px}
.host-ping{display:flex;align-items:center;gap:6px;padding-bottom:7px;white-space:nowrap}
.host-row button{padding:5px 12px}
.host-row .hint{color:var(--muted);font-size:11px;white-space:nowrap}
.backup-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1b202a;flex-wrap:wrap}
.backup-row .hint{color:var(--muted);font-size:11px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>📟 Syslog</h1>
  <span id="status" class="muted">…</span>
  <span id="hosts" class="muted" title="Known syslog sources">…</span>
  <span id="ver" class="muted" title="Server version">…</span>
  <span id="disk" class="muted" title="Disk space left on the server">💾 …</span>
  <div style="flex:1"></div>
  <label class="muted"><input type="checkbox" id="autorefresh" checked> auto</label>
  <button id="backupsBtn" title="Manage backups">🗄</button>
  <button id="updateBtn" title="Update from GitHub (backs up, downloads latest, restarts)">⬆ Update</button>
  <button id="refresh">Refresh</button>
</header>
<div class="wrap">
  <aside>
    <div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center" class="muted">Log days
      <button id="delAll" class="danger" title="Delete all logs">Delete all</button>
    </div>
    <div id="days"></div>
  </aside>
  <main>
    <div class="filters">
      <input id="q" placeholder="search…">
      <button id="clearFilters" title="Clear search, host and severity filters">✕ Clear</button>
      <input id="host" placeholder="host…" list="hostList">
      <datalist id="hostList"></datalist>
      <select id="order" title="Sort order">
        <option value="desc">Newest first</option>
        <option value="asc">Oldest first</option>
      </select>
      <button id="export" title="Download filtered view as CSV">⬇ CSV</button>
      <span id="total" class="muted"></span>
    </div>
    <div class="chips" id="chips">
      <button data-sev="" class="active">All</button>
      <button data-sev="emerg,alert,crit,err">⚠ Problems</button>
      <button data-sev="warning,notice,info,debug">⚠️ Warning+</button>
      <button data-sev="debug">🐞 Debug</button>
    </div>
    <div class="table">
      <table>
        <thead><tr><th>Time</th><th>Host</th><th>Level</th><th>Tag</th><th>Message</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>
<div class="modal-overlay" id="hostsModal" style="display:none">
  <div class="modal">
    <div class="modal-header">📡 Syslog Hosts — set "data/ping online after" per device
      <button id="closeHosts">✕</button>
    </div>
    <div class="modal-body" id="hostsList"></div>
    <div class="modal-footer muted">0 or ↺ = server defaults (60s data · 60s ping) · changes apply immediately</div>
  </div>
</div>
<div class="modal-overlay" id="backupsModal" style="display:none">
  <div class="modal">
    <div class="modal-header">🗄 Backups — restore or delete
      <button id="closeBackups">✕</button>
    </div>
    <div class="modal-body">
      <div class="backup-row">
        <label class="hint">Keep</label>
        <input type="number" id="backupKeep" min="0" max="50" value="3" style="width:70px">
        <button id="saveKeep">Save</button>
        <span style="flex:1"></span>
        <button id="deleteAllBackups" class="danger">Delete all</button>
      </div>
      <div id="backupsList"></div>
    </div>
    <div class="modal-footer muted">Restore copies the files back and restarts the service · Delete is permanent</div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let current = '', timer = null, daysData = [], sevFilter = '';
const api = async (p, o) => { const r = await fetch(p, o); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = (b) => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(2) + ' MB' : b >= 1e3 ? (b / 1e3).toFixed(1) + ' KB' : b + ' B';

function loadDays() {
  return api('/api/days').then(({ days }) => {
    daysData = days;
    const totalCount = days.reduce((s, d) => s + d.count, 0);
    const totalSize = days.reduce((s, d) => s + d.size, 0);
    $('#days').innerHTML =
      (days.length ? `<div class="day" style="cursor:default;font-weight:600"><span>Total</span><span class="count">${totalCount} · ${fmtSize(totalSize)}</span></div><div style="height:1px;background:var(--line);margin:6px 0"></div>` : '') +
      days.map((d) => `
      <div class="day ${d.date === current ? 'active' : ''}" data-date="${d.date}">
        <span>${d.date} <span class="count">(${d.count} · ${fmtSize(d.size)})</span></span>
        <button class="del danger" title="delete this day"
          onclick="event.stopPropagation();delDay('${d.date}')">🗑</button>
      </div>`).join('') || '<div class="muted">no logs yet</div>';
    document.querySelectorAll('.day').forEach((el) =>
      el.addEventListener('click', () => { current = el.dataset.date; refresh(); loadDays(); }));
  }).catch(() => setStatus(false));
}

function delDay(date) {
  if (!confirm(`Delete all logs for ${date}?`)) return;
  api(`/api/logs?date=${date}`, { method: 'DELETE' }).then(() => {
    if (current === date) { current = ''; }
    loadDays().then(() => refresh());
  });
}

function delEntry(id) {
  if (!confirm('Delete this entry?')) return;
  api(`/api/entry?date=${current}&id=${id}`, { method: 'DELETE' }).then(() => {
    loadDays().then(() => refresh());
  });
}

function filterHost(host) {
  $('#host').value = host;
  refresh();
}

function refresh() {
  if (!current) {
    $('#rows').innerHTML = '<tr><td colspan="6" class="muted">select a day</td></tr>';
    $('#total').textContent = '';
    return;
  }
  const qs = new URLSearchParams({ date: current, limit: 500 });
  if ($('#q').value) qs.set('q', $('#q').value);
  if (sevFilter) qs.set('severity', sevFilter);
  if ($('#host').value) qs.set('host', $('#host').value);
  qs.set('order', $('#order').value);
  api('/api/logs?' + qs).then(({ logs, total }) => {
    const day = daysData.find((d) => d.date === current);
    $('#total').textContent = day ? `${total} entries · ${fmtSize(day.size)}` : `${total} entries`;
    $('#rows').innerHTML = logs.map((e) => `
      <tr>
        <td class="muted">${new Date(e.ts).toLocaleString()}</td>
        <td><a href="#" class="hostlink" data-host="${esc(e.host)}" title="Filter by this host" onclick="event.preventDefault();filterHost(this.dataset.host)">${esc(e.host)}</a></td>
        <td><span class="sev ${e.severity}">${e.severity}</span></td>
        <td class="muted">${esc(e.tag)}</td>
        <td class="msg">${esc(e.msg)}</td>
        <td><button class="del danger" onclick="delEntry('${e.id}')">✕</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">no matching entries</td></tr>';
  }).catch(() => {});
}

$('#refresh').onclick = () => { refresh(); loadDays(); };
$('#delAll').onclick = () => {
  if (!daysData.length) return;
  const n = daysData.reduce((s, d) => s + d.count, 0);
  if (!confirm(`Delete ALL logs? (${n} entries across ${daysData.length} day(s))`)) return;
  api('/api/logs/all', { method: 'DELETE' }).then(() => {
    current = ''; $('#rows').innerHTML = ''; loadDays(); refresh();
  }).catch((e) => alert('Delete failed: ' + e.message));
};
$('#export').onclick = () => {
  if (!current) return;
  const qs = new URLSearchParams({ date: current });
  if ($('#q').value) qs.set('q', $('#q').value);
  if (sevFilter) qs.set('severity', sevFilter);
  if ($('#host').value) qs.set('host', $('#host').value);
  qs.set('order', $('#order').value);
  window.location = '/api/export?' + qs;
};
$('#autorefresh').onchange = () => {
  clearInterval(timer);
  if ($('#autorefresh').checked) timer = setInterval(() => { loadDays(); refresh(); }, 5000);
};
['#q', '#host', '#order'].forEach((s) => $(s).addEventListener('input', refresh));
$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-sev]');
  if (!b) return;
  sevFilter = b.dataset.sev;
  document.querySelectorAll('#chips button[data-sev]').forEach((x) => x.classList.toggle('active', x === b));
  refresh();
});
$('#clearFilters').onclick = () => {
  $('#q').value = ''; $('#host').value = ''; sevFilter = '';
  document.querySelectorAll('#chips button[data-sev]').forEach((x) => x.classList.toggle('active', x.dataset.sev === ''));
  refresh();
};
function setStatus(ok) {
  const el = $('#status');
  el.textContent = ok ? '● online' : '● offline';
  el.className = ok ? 'online' : 'offline';
}
function checkHealth() {
  fetch('/api/health', { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : Promise.reject())
    .then((h) => { setStatus(h.ok !== false); $('#ver').textContent = h.version ? 'v' + h.version : ''; })
    .catch(() => setStatus(false));
}
function loadDisk() {
  fetch('/api/disk', { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : Promise.reject())
    .then((d) => {
      const el = $('#disk');
      el.textContent = '💾 ' + fmtSize(d.free || 0) + ' left';
      const pct = d.percent || 0;
      el.style.color = pct >= 90 ? '#ef4444' : pct >= 75 ? '#f59e0b' : '';
    })
    .catch(() => { $('#disk').textContent = '💾 —'; });
}
function loadHosts() {
  fetch('/api/hosts', { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : Promise.reject())
    .then(({ online, offline, onlineCount, offlineCount }) => {
      $('#hosts').innerHTML =
        `<span class="online-dot">●</span> ${onlineCount}&nbsp; ` +
        `<span class="offline-dot">●</span> ${offlineCount}`;
    })
    .catch(() => { $('#hosts').textContent = '—'; });
}
function loadHostFilter() {
  fetch('/api/hosts/all', { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : Promise.reject())
    .then(({ hosts }) => {
      $('#hostList').innerHTML = (hosts || [])
        .map((h) => `<option value="${esc(h)}"></option>`).join('');
    })
    .catch(() => {});
}
function fmtAgo(ms) {
  if (ms < 60000) return Math.round(ms / 1000) + 's ago';
  if (ms < 3600000) return Math.round(ms / 60000) + 'm ago';
  return Math.round(ms / 3600000) + 'h ago';
}

function openHostsModal() {
  const modal = $('#hostsModal');
  modal.style.display = 'flex';
  fetch('/api/hosts', { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : Promise.reject())
    .then(({ online, offline }) => {
      const rows = [...online, ...offline].map((h) => `
        <div class="host-row" data-host="${esc(h.host)}">
          <div class="host-top">
            <span class="${h.online ? 'online-dot' : 'offline-dot'}">●</span>
            <span class="host-name" title="${esc(h.host)}">${esc(h.host)}</span>
            <span class="hint">${fmtAgo(h.lastSeenAgoMs)}${h.pingOk ? ' · 📶' : ''}${h.via && h.via !== 'none' ? ' · ' + h.via : ''}</span>
          </div>
          <div class="host-controls">
            <label class="host-ping"><input type="checkbox" data-ping ${h.ping ? 'checked' : ''}> ping</label>
            <div class="host-field">
              <label>data after</label>
              <input type="number" data-datams min="0" max="86400" step="1" value="${Math.round((h.configuredMs || h.onlineMs) / 1000)}">
            </div>
            <div class="host-field">
              <label>ping after</label>
              <input type="number" data-pingms min="0" max="86400" step="1" value="${Math.round((h.configuredPingMs || h.pingMs) / 1000)}">
            </div>
            <button data-action="save">Save</button>
            <button data-action="reset" title="Use defaults">↺</button>
          </div>
        </div>`).join('');
      $('#hostsList').innerHTML = rows || '<div class="muted">no hosts seen yet</div>';
    })
    .catch(() => { $('#hostsList').innerHTML = '<div class="muted">unreachable</div>'; });
}

$('#hosts').onclick = openHostsModal;
$('#closeHosts').onclick = () => { $('#hostsModal').style.display = 'none'; };
$('#hostsModal').addEventListener('click', (e) => {
  if (e.target === $('#hostsModal')) $('#hostsModal').style.display = 'none';
});
$('#hostsList').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const row = btn.closest('.host-row');
  const host = row.dataset.host;
  const pingEl = row.querySelector('[data-ping]');
  const onlineMs = btn.dataset.action === 'reset' ? 0 : Number(row.querySelector('[data-datams]').value) * 1000;
  const pingMs = btn.dataset.action === 'reset' ? 0 : Number(row.querySelector('[data-pingms]').value) * 1000;
  fetch('/api/hosts/config', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ host, onlineMs, pingMs, ping: pingEl ? pingEl.checked : undefined }),
  }).then((r) => r.ok ? openHostsModal() : alert('Save failed'));
});

function openBackupsModal() {
  const modal = $('#backupsModal');
  modal.style.display = 'flex';
  fetch('/api/backups', { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : Promise.reject())
    .then(({ backups, keep }) => {
      $('#backupKeep').value = keep;
      $('#backupsList').innerHTML = backups.length ? backups.map((b) => `
        <div class="backup-row" data-name="${esc(b.name)}">
          <span class="host-name">${esc(b.name)}</span>
          <span class="hint">${fmtSize(b.size)}</span>
          <span style="flex:1"></span>
          <button data-action="restore">Restore</button>
          <button data-action="delete" class="danger">Delete</button>
        </div>`).join('') : '<div class="muted">no backups yet</div>';
    })
    .catch(() => { $('#backupsList').innerHTML = '<div class="muted">unreachable</div>'; });
}

$('#backupsBtn').onclick = openBackupsModal;
$('#updateBtn').onclick = () => {
  if (!confirm('Update the syslog server from GitHub?\nIt will back up the current version, download the latest code, and restart the service.')) return;
  fetch('/api/update', { method: 'POST' })
    .then((r) => r.ok ? r.json() : Promise.reject())
    .then((d) => alert('Update complete!\nBacked up to ' + (d.backup || '?') + '.\nThe service is restarting — refresh in a few seconds.'))
    .catch(() => alert('Update failed — is the server online?'));
};
$('#closeBackups').onclick = () => { $('#backupsModal').style.display = 'none'; };
$('#backupsModal').addEventListener('click', (e) => {
  if (e.target === $('#backupsModal')) $('#backupsModal').style.display = 'none';
});
$('#saveKeep').onclick = () => {
  const keep = Number($('#backupKeep').value);
  fetch('/api/backups/keep', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keep }),
  }).then((r) => r.ok ? openBackupsModal() : alert('Save failed'));
};
$('#deleteAllBackups').onclick = () => {
  if (!confirm('Delete ALL backups? This is permanent.')) return;
  fetch('/api/backups/all', { method: 'DELETE' }).then((r) => r.ok ? openBackupsModal() : alert('Delete failed'));
};
$('#backupsList').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const row = btn.closest('.backup-row');
  const name = row.dataset.name;
  if (btn.dataset.action === 'restore') {
    if (!confirm(`Restore backup ${name}? The service will restart.`)) return;
    fetch('/api/backups/restore', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }),
    }).then((r) => r.ok ? alert('Restored! The service is restarting.') : alert('Restore failed'));
  } else {
    if (!confirm(`Delete backup ${name}?`)) return;
    fetch('/api/backups?name=' + encodeURIComponent(name), { method: 'DELETE' })
      .then((r) => r.ok ? openBackupsModal() : alert('Delete failed'));
  }
});

checkHealth();
loadHosts();
loadHostFilter();
loadDisk();
loadDays();
timer = setInterval(() => { loadDays(); refresh(); checkHealth(); loadHosts(); loadDisk(); }, 5000);
setInterval(() => { loadHostFilter(); }, 30000);
</script>
</body>
</html>
